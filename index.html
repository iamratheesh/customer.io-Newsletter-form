<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer.io Test Form</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
      }

      h1 {
        margin-bottom: 20px;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
      }

      button {
        padding: 10px 15px;
        cursor: pointer;
      }

      form {
        display: grid;
        gap: 12px;
      }

      input {
        padding: 10px;
        font-size: 14px;
      }

      .submit-btn {
        background: #2563eb;
        color: white;
        border: none;
      }

      textarea {
        margin-top: 20px;
        width: 100%;
        height: 250px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1>Customer.io Test Form</h1>

    <div class="buttons">
      <button onclick="scenario1()">Scenario 1</button>
      <button onclick="scenario2()">Scenario 2</button>
      <button onclick="scenario3()">Scenario 3</button>
      <button onclick="scenario4()">Scenario 4</button>
      <button onclick="scenario5()">Scenario 5</button>
      <button onclick="scenario6()">Scenario 6</button>
    </div>

    <form id="lead-form">
      <input type="email" name="email" placeholder="Email" required />

      <input type="text" name="firstName" placeholder="First Name" />

      <input type="text" name="lastName" placeholder="Last Name" />

      <input type="text" name="formName" placeholder="Form Name" />

      <input type="text" name="source" placeholder="Source" />

      <input type="text" name="utm_source" placeholder="UTM Source" />

      <input type="text" name="utm_medium" placeholder="UTM Medium" />

      <input type="text" name="utm_campaign" placeholder="UTM Campaign" />

      <input type="text" name="submittedAt" placeholder="Submitted At" />

      <button type="submit" class="submit-btn">Submit</button>
    </form>

    <h3>Payload Preview</h3>
    <textarea id="preview" readonly></textarea>

    <script>
      const form = document.getElementById("lead-form");

      function fill(data) {
        Object.keys(data).forEach((key) => {
          const field = form.querySelector(`[name="${key}"]`);

          if (field) {
            field.value = data[key];
          }
        });

        updatePreview();
      }

      function updatePreview() {
        const data = {};

        new FormData(form).forEach((value, key) => {
          if (value) {
            data[key] = value;
          }
        });

        document.getElementById("preview").value = JSON.stringify(
          data,
          null,
          2,
        );
      }

      form.addEventListener("input", updatePreview);

      function scenario1() {
        fill({
          email: "newsletter.user@example.com",
          source: "newsletter_signup",
          utm_source: "linkedin",
          utm_medium: "social",
          utm_campaign: "ai_newsletter_june",
        });
      }

      function scenario2() {
        fill({
          email: "existing.contact@example.com",
          source: "newsletter_signup",
          utm_source: "google",
          utm_medium: "cpc",
          utm_campaign: "newsletter_growth",
        });
      }

      function scenario3() {
        fill({
          email: "sophia.reed@example.com",
          firstName: "Sophia",
          lastName: "Reed",
          formName: "Contact Us",
          source: "website",
          utm_source: "google",
          utm_medium: "organic",
          utm_campaign: "website_leads",
        });
      }

      function scenario4() {
        fill({
          email: "existing.contact@example.com",
          firstName: "John",
          lastName: "Smith",
          formName: "Request Demo",
          source: "website",
          utm_source: "linkedin",
          utm_medium: "paid_social",
          utm_campaign: "demo_request",
        });
      }

      function scenario5() {
        fill({
          email: "existing.contact@example.com",
          firstName: "John",
          lastName: "Smith",
          formName: "Request Demo",
          submittedAt: "2026-06-12T09:00:00Z",
          source: "website",
          utm_source: "google",
          utm_medium: "cpc",
          utm_campaign: "demo_campaign",
        });
      }

      function scenario6() {
        fill({
          email: "duplicate.record@example.com",
          firstName: "Michael",
          lastName: "Johnson",
          formName: "Contact Us",
          source: "website",
          utm_source: "email",
          utm_medium: "marketing",
          utm_campaign: "spring_campaign",
        });
      }

      updatePreview();

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const payload = {};

        new FormData(form).forEach((value, key) => {
          payload[key] = value;
        });

        console.log("Submitting payload:", payload);

        alert("Payload ready. Open browser console to view submitted data.");

        // Customer.io form script will be loaded below
      });
    </script>

    <!-- Customer.io Forms Loader -->
    <script type="text/javascript">
      (function () {
        var t = document.createElement("script"),
          s = document.getElementsByTagName("script")[0];

        t.async = true;
        t.id = "cio-forms-handler";
        t.setAttribute("data-site-id", "ce11ab273bfbb500521b");
        t.setAttribute("data-base-url", "https://customerioforms.com");

        t.src = "https://customerioforms.com/assets/forms.js";

        s.parentNode.insertBefore(t, s);
      })();
    </script>
  </body>
</html>
